name: Build Waveshare ESP32-C6-DEV-KIT-N16

on:
  push:
    branches:
      - c6-dev-kit-n16-upstream-sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Waveshare ESP32-C6-DEV-KIT-N16
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build firmware
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py \
            waveshare/esp32-c6-dev-kit-n16 \
            --name esp32-c6-dev-kit-n16 \
            --wake-word nihaoxiaozhi

      - name: Show partition table
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          echo "===== PARTITION TABLE ====="
          python $IDF_PATH/components/partition_table/gen_esp32part.py \
              build/partition_table/partition-table.bin || true

      - name: Locate srmodels.bin
        shell: bash
        run: |
          SRMODELS=$(find build -name "srmodels.bin" | head -1)
          echo "srmodels=$SRMODELS"
          if [ -z "$SRMODELS" ]; then
            echo "ERROR: srmodels.bin not found in build/"
            exit 1
          fi
          cp "$SRMODELS" build/srmodels.bin
          ls -lh build/srmodels.bin

      - name: Merge full firmware with model partition
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python -m esptool --chip esp32c6 merge-bin \
            -o build/merged-full.bin -f raw \
            --flash-mode dio --flash-freq 80m --flash-size 16MB \
            0x0      build/bootloader/bootloader.bin \
            0x8000   build/partition_table/partition-table.bin \
            0xd000   build/ota_data_initial.bin \
            0x10000  build/srmodels.bin \
            0x100000 build/xiaozhi.bin \
            0x700000 build/generated_assets.bin
          ls -lh build/merged-full.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: xiaozhi_waveshare-esp32-c6-dev-kit-n16_${{ github.sha }}
          path: |
            build/merged-full.bin
            build/srmodels.bin
            build/generated_assets.bin
            build/partition_table/partition-table.bin
            build/xiaozhi.bin
            build/xiaozhi.elf
            build/bootloader/bootloader.bin
            build/ota_data_initial.bin
          if-no-files-found: error
